<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Informasi Organisasi</title>
  
  <!-- Kumpulan Library -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800">
  
  <!-- Layar Pendeteksi Error (Akan muncul jika ada salah ketik) -->
  <div id="error-screen" style="display: none; padding: 20px; background: #fee2e2; color: #991b1b; border-bottom: 4px solid #ef4444; font-family: monospace;">
    <h2 style="font-size: 18px; font-weight: bold; margin-bottom: 10px;">⚠️ Terjadi Kesalahan Kode (Syntax Error)</h2>
    <p>Sepertinya ada tanda baca (koma/kutip) yang hilang saat copy-paste kode Firebase.</p>
    <div id="error-message" style="margin-top: 10px; background: #fff; padding: 10px; border-radius: 5px;"></div>
  </div>

  <div id="root"></div>

  <!-- Script Pendeteksi Error -->
  <script>
    window.onerror = function(message, source, lineno, colno, error) {
      document.getElementById('error-screen').style.display = 'block';
      document.getElementById('error-message').innerText = "Detail: " + message + " (Baris: " + lineno + ")";
    };
  </script>

  <script type="text/babel">
    const { useState, useEffect, createContext, useContext } = React;

    // Data Bawaan (Akan ditimpa oleh data Cloud jika ada)
    const INITIAL_USERS = [
      { id: 1, nim: '1011001', name: 'Budi (Admin)', role: 'admin', division: 'Inti', position: 'Ketua', password: 'admin', photo: 'https://placehold.co/150x150/4f46e5/ffffff?text=BD' },
      { id: 2, nim: '1011002', name: 'Siti (Anggota)', role: 'user', division: 'Humas', position: 'Staff', password: 'user', photo: 'https://placehold.co/150x150/ec4899/ffffff?text=ST' },
    ];
    const INITIAL_FINANCE = { balance: 1500000, weeklyDues: 10000, transactions: [{ id: 1, type: 'income', amount: 50000, date: '2026-10-15', desc: 'Uang Kas Awal' }], duesStatus: { 2: [true, false, false, false] } };
    const INITIAL_SCHEDULES = [{ id: 1, title: 'Rapat Kerja Bulanan', date: '2026-10-20', time: '15:00', location: 'Ruang Sidang 1', description: 'Membahas proker.' }];
    
    const AppContext = createContext();

    function App() {
      const [currentUser, setCurrentUser] = useState(null);
      const [firebaseReady, setFirebaseReady] = useState(false);
      const [firebaseError, setFirebaseError] = useState(false);
      
      const [users, setUsers] = useState(INITIAL_USERS);
      const [schedules, setSchedules] = useState(INITIAL_SCHEDULES);
      const [finance, setFinance] = useState(INITIAL_FINANCE);
      const [activeQR, setActiveQR] = useState(false);
      const [attendanceRecord, setAttendanceRecord] = useState({});

      const [dbInfo, setDbInfo] = useState(null);

      useEffect(() => {
        const initDB = async () => {
          try {
            // ========================================================
            // KODE FIREBASE SUDAH DIMASUKKAN DENGAN SEMPURNA DI SINI
            // ========================================================
            const myFirebaseConfig = {
              apiKey: "AIzaSyCe4dOrr6ChY6C94ud7eReqLPpG6K1jlck",
              authDomain: "web-organisasi-1.firebaseapp.com",
              projectId: "web-organisasi-1",
              storageBucket: "web-organisasi-1.firebasestorage.app",
              messagingSenderId: "830803587379",
              appId: "1:830803587379:web:023b24404c81544a624e46",
              measurementId: "G-LQQZXVJLE9"
            };
            // ========================================================

            const appModule = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js");
            const authModule = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js");
            const firestoreModule = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");

            const app = appModule.initializeApp(myFirebaseConfig);
            const auth = authModule.getAuth(app);
            const db = firestoreModule.getFirestore(app);
            
            // Login rahasia di latar belakang agar diizinkan menyimpan data
            await authModule.signInAnonymously(auth);

            setDbInfo({ db, auth, firestoreModule, appId: myFirebaseConfig.projectId });
            setFirebaseReady(true);
          } catch (err) {
            console.error("Firebase Gagal:", err);
            setFirebaseError(true);
          }
        };
        initDB();
      }, []);

      // Sinkronisasi Firebase (Real-time)
      useEffect(() => {
        if (!firebaseReady || !dbInfo) return;
        const { db, firestoreModule } = dbInfo;
        const docRef = firestoreModule.doc(db, 'organisasi', 'data_utama');

        const unsubscribe = firestoreModule.onSnapshot(docRef, (snapshot) => {
          if (snapshot.exists()) {
            const data = snapshot.data();
            if (data.users) setUsers(data.users);
            if (data.finance) setFinance(data.finance);
            if (data.schedules) setSchedules(data.schedules);
            if (data.attendanceRecord) setAttendanceRecord(data.attendanceRecord);
            if (data.activeQR !== undefined) setActiveQR(data.activeQR);
          } else {
            // Jika database masih kosong, isi dengan data bawaan
            firestoreModule.setDoc(docRef, { users: INITIAL_USERS, finance: INITIAL_FINANCE, schedules: INITIAL_SCHEDULES, attendanceRecord: {}, activeQR: false });
          }
        });
        return () => unsubscribe();
      }, [firebaseReady, dbInfo]);

      const updateGlobal = async (key, value) => {
        if (!dbInfo) return;
        const { db, firestoreModule } = dbInfo;
        const docRef = firestoreModule.doc(db, 'organisasi', 'data_utama');
        try { 
          await firestoreModule.setDoc(docRef, { [key]: value }, { merge: true }); 
        } catch (e) { 
          console.error("Gagal simpan:", e); 
        }
      };

      const handleLogin = (nim, password) => {
        const user = users.find(u => u.nim === nim && u.password === password);
        if (user) { setCurrentUser(user); return true; }
        return false;
      };

      return (
        <AppContext.Provider value={{
          currentUser, handleLogout: () => setCurrentUser(null),
          users, setUsers: (v) => { setUsers(v); updateGlobal('users', v); },
          schedules, setSchedules: (v) => { setSchedules(v); updateGlobal('schedules', v); },
          finance, setFinance: (v) => { setFinance(v); updateGlobal('finance', v); },
          activeQR, setActiveQR: (v) => { setActiveQR(v); updateGlobal('activeQR', v); },
          attendanceRecord, setAttendanceRecord: (v) => { setAttendanceRecord(v); updateGlobal('attendanceRecord', v); }
        }}>
          {currentUser ? <MainLayout /> : <LoginScreen onLogin={handleLogin} fError={firebaseError} fReady={firebaseReady} />}
        </AppContext.Provider>
      );
    }

    function LoginScreen({ onLogin, fError, fReady }) {
      const [nim, setNim] = useState('');
      const [pass, setPass] = useState('');
      const [err, setErr] = useState('');

      const submit = (e) => {
        e.preventDefault();
        if (!onLogin(nim, pass)) setErr('NIM atau Password salah!');
      };

      return (
        <div className="min-h-screen bg-slate-100 flex items-center justify-center p-4">
          <div className="bg-white p-8 rounded-3xl shadow-xl w-full max-w-md">
            <div className="text-center mb-8">
              <div className="bg-indigo-600 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4"><i className="fa-solid fa-users text-white text-2xl"></i></div>
              <h1 className="text-2xl font-black text-slate-800">Portal Organisasi</h1>
              <p className="text-slate-500 text-sm mt-1">Sistem Informasi Terpadu</p>
            </div>
            
            {fReady && (
              <div className="bg-emerald-50 text-emerald-700 p-4 rounded-xl mb-4 text-sm font-bold border border-emerald-200 text-center">
                <i className="fa-solid fa-cloud-check mr-2"></i> Tersambung ke Cloud (Online)
              </div>
            )}
            {fError && (
              <div className="bg-yellow-50 text-yellow-700 p-4 rounded-xl mb-4 text-sm font-bold border border-yellow-200">
                <i className="fa-solid fa-triangle-exclamation mr-2"></i> Mode Offline Aktif (Cloud Gagal).
              </div>
            )}
            {err && <div className="bg-red-50 text-red-600 p-3 rounded-xl mb-4 text-sm font-bold text-center">{err}</div>}

            <form onSubmit={submit} className="space-y-4">
              <div><label className="block text-sm font-bold text-slate-700 mb-1">NIM / ID</label><input type="text" className="w-full px-4 py-3 bg-slate-50 border rounded-xl outline-none" value={nim} onChange={e=>setNim(e.target.value)} required placeholder="Contoh: 1011001" /></div>
              <div><label className="block text-sm font-bold text-slate-700 mb-1">Password</label><input type="password" className="w-full px-4 py-3 bg-slate-50 border rounded-xl outline-none" value={pass} onChange={e=>setPass(e.target.value)} required placeholder="••••••••" /></div>
              <button type="submit" className="w-full bg-indigo-600 text-white font-black py-3.5 rounded-xl hover:bg-indigo-700 transition shadow-lg mt-2">Masuk</button>
            </form>
          </div>
        </div>
      );
    }

    function MainLayout() {
      const { currentUser, handleLogout } = useContext(AppContext);
      const [tab, setTab] = useState('dashboard');
      
      const navs = [
        { id: 'dashboard', label: 'Dashboard', icon: 'fa-house' },
        { id: 'absensi', label: 'Absensi', icon: 'fa-qrcode' },
        { id: 'kas', label: 'Keuangan', icon: 'fa-wallet' },
        { id: 'anggota', label: 'Anggota', icon: 'fa-users' },
      ];

      return (
        <div className="min-h-screen bg-slate-50 flex flex-col md:flex-row">
          <div className="md:hidden bg-indigo-700 text-white p-4 flex justify-between items-center shadow-lg">
            <span className="font-black text-xl"><i className="fa-solid fa-cloud mr-2"></i>OrgCloud</span>
            <button onClick={handleLogout} className="bg-red-500 px-3 py-1 rounded-lg font-bold text-sm"><i className="fa-solid fa-power-off"></i></button>
          </div>

          <div className="hidden md:flex flex-col w-64 bg-white shadow-xl h-screen sticky top-0">
            <div className="p-6 text-indigo-700 font-black text-2xl border-b"><i className="fa-solid fa-cloud mr-2"></i>OrgCloud</div>
            <nav className="flex-1 p-4 space-y-2">
              {navs.map(n => (
                <button key={n.id} onClick={()=>setTab(n.id)} className={`w-full flex items-center p-3 rounded-xl transition ${tab===n.id ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-100 font-bold'}`}>
                  <i className={`fa-solid ${n.icon} w-6 text-center mr-2`}></i> {n.label}
                </button>
              ))}
            </nav>
            <div className="p-4 border-t">
              <button onClick={handleLogout} className="w-full bg-red-50 text-red-600 font-bold p-3 rounded-xl hover:bg-red-100 transition"><i className="fa-solid fa-power-off mr-2"></i> Keluar</button>
            </div>
          </div>

          <div className="flex-1 p-4 md:p-8 overflow-y-auto">
            {tab === 'dashboard' && <ViewDashboard setTab={setTab}/>}
            {tab === 'absensi' && <ViewAbsensi />}
            {tab === 'kas' && <ViewKas />}
            {tab === 'anggota' && <ViewAnggota />}
          </div>
          
          <div className="md:hidden fixed bottom-0 left-0 right-0 bg-white shadow-[0_-4px_10px_rgba(0,0,0,0.05)] border-t flex justify-around p-3 z-50">
             {navs.map(n => (
                <button key={n.id} onClick={()=>setTab(n.id)} className={`flex flex-col items-center p-2 rounded-xl ${tab===n.id ? 'text-indigo-600' : 'text-slate-400'}`}>
                  <i className={`fa-solid ${n.icon} text-xl mb-1`}></i>
                  <span className="text-[10px] font-bold">{n.label}</span>
                </button>
             ))}
          </div>
        </div>
      );
    }

    function ViewDashboard({setTab}) {
      const { users, finance, currentUser } = useContext(AppContext);
      return (
        <div className="space-y-6 pb-20 md:pb-0">
          <div className="bg-gradient-to-r from-indigo-600 to-purple-600 rounded-3xl p-6 md:p-8 text-white shadow-lg">
            <h2 className="text-2xl md:text-3xl font-black mb-1">Halo, {currentUser.name}! 👋</h2>
            <p className="text-indigo-100 font-medium text-sm md:text-base">Selamat datang di dashboard organisasi.</p>
          </div>
          <div className="grid grid-cols-2 md:grid-cols-3 gap-4">
            <div onClick={()=>setTab('anggota')} className="bg-white p-5 rounded-2xl shadow-sm border flex flex-col items-center justify-center cursor-pointer">
              <div className="w-12 h-12 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mb-2"><i className="fa-solid fa-users text-xl"></i></div>
              <h3 className="text-2xl font-black text-slate-800">{users.length}</h3><p className="text-xs font-bold text-slate-400">Total Anggota</p>
            </div>
            <div onClick={()=>setTab('kas')} className="bg-white p-5 rounded-2xl shadow-sm border flex flex-col items-center justify-center cursor-pointer">
              <div className="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mb-2"><i className="fa-solid fa-wallet text-xl"></i></div>
              <h3 className="text-xl font-black text-slate-800">Rp {finance.balance.toLocaleString('id')}</h3><p className="text-xs font-bold text-slate-400">Saldo Kas</p>
            </div>
          </div>
        </div>
      );
    }

    function ViewAbsensi() {
      const { currentUser, users, activeQR, setActiveQR, attendanceRecord, setAttendanceRecord } = useContext(AppContext);
      
      const handleScan = () => {
        if(activeQR) {
           setAttendanceRecord({...attendanceRecord, [currentUser.id]: true});
           alert("✅ Berhasil Absen!");
        } else alert("❌ Sesi belum dibuka Admin!");
      };

      return (
        <div className="space-y-6 pb-20 md:pb-0">
          <div className="flex justify-between items-center"><h2 className="text-2xl font-black">Absensi</h2>
          {currentUser.role === 'admin' && <button onClick={()=>setActiveQR(!activeQR)} className={`px-4 py-2 text-white font-bold rounded-xl ${activeQR?'bg-red-500':'bg-indigo-600'}`}>{activeQR?'Tutup QR':'Buka QR'}</button>}</div>
          
          <div className="bg-white p-6 rounded-3xl border text-center">
            {activeQR ? <img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=Hadir" className="mx-auto mb-4 border-4 border-indigo-100 rounded-xl"/> : <div className="w-40 h-40 bg-slate-100 border-2 border-dashed rounded-xl mx-auto mb-4 flex items-center justify-center text-slate-400"><i className="fa-solid fa-qrcode text-4xl"></i></div>}
            {currentUser.role === 'user' && <button onClick={handleScan} className="w-full bg-slate-800 text-white font-black py-3 rounded-xl"><i className="fa-solid fa-camera mr-2"></i> Scan QR Absen</button>}
          </div>

          <div className="bg-white rounded-3xl border overflow-hidden">
            <div className="p-4 bg-slate-50 font-black border-b">Daftar Kehadiran</div>
            {users.map(u => (
              <div key={u.id} className="flex justify-between items-center p-4 border-b last:border-0">
                <div className="font-bold">{u.name}</div>
                <div>{attendanceRecord[u.id] ? <span className="bg-emerald-100 text-emerald-700 px-3 py-1 rounded-full text-xs font-black">Hadir</span> : <span className="bg-slate-100 text-slate-500 px-3 py-1 rounded-full text-xs font-black">Belum</span>}</div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function ViewKas() {
      const { finance } = useContext(AppContext);
      return (
        <div className="space-y-6 pb-20 md:pb-0">
          <h2 className="text-2xl font-black">Kas Organisasi</h2>
          <div className="bg-indigo-600 p-6 rounded-3xl text-white text-center shadow-lg">
            <p className="text-indigo-200 font-bold text-sm">Total Saldo Kas</p>
            <h3 className="text-4xl font-black mt-1">Rp {finance.balance.toLocaleString('id')}</h3>
          </div>
          <div className="text-center p-6 bg-white border rounded-3xl">
             <p className="font-bold text-slate-500 mb-4">Bayar Kas via QRIS</p>
             <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=BayarKas" className="mx-auto border-4 border-slate-100 rounded-xl" />
          </div>
        </div>
      );
    }

    function ViewAnggota() {
      const { users, currentUser, setUsers } = useContext(AppContext);
      const [newMember, setNewMember] = useState(null);

      const handleAdd = (e) => {
        e.preventDefault();
        const id = Date.now();
        setUsers([...users, { ...newMember, id, photo: `https://placehold.co/150x150/94a3b8/ffffff?text=${newMember.name.substring(0,2).toUpperCase()}` }]);
        setNewMember(null);
      };

      return (
        <div className="space-y-6 pb-20 md:pb-0">
          <div className="flex justify-between items-center">
            <h2 className="text-2xl font-black">Anggota</h2>
            {currentUser.role === 'admin' && <button onClick={()=>setNewMember({ nim: '', name: '', role: 'user', division: '', position: 'Staff', password: 'user' })} className="bg-indigo-600 text-white px-4 py-2 rounded-xl font-bold text-sm"><i className="fa-solid fa-plus mr-1"></i> Tambah</button>}
          </div>

          {newMember && (
            <div className="bg-white p-4 rounded-2xl border mb-4">
              <h3 className="font-bold mb-3 text-sm">Tambah Anggota Baru</h3>
              <form onSubmit={handleAdd} className="space-y-3">
                <input required placeholder="NIM / ID" className="w-full border p-2 rounded-lg text-sm" value={newMember.nim} onChange={e=>setNewMember({...newMember, nim: e.target.value})} />
                <input required placeholder="Nama Lengkap" className="w-full border p-2 rounded-lg text-sm" value={newMember.name} onChange={e=>setNewMember({...newMember, name: e.target.value})} />
                <input required placeholder="Divisi" className="w-full border p-2 rounded-lg text-sm" value={newMember.division} onChange={e=>setNewMember({...newMember, division: e.target.value})} />
                <div className="flex gap-2">
                   <button type="button" onClick={()=>setNewMember(null)} className="flex-1 bg-slate-100 text-slate-600 font-bold py-2 rounded-lg text-sm">Batal</button>
                   <button type="submit" className="flex-1 bg-indigo-600 text-white font-bold py-2 rounded-lg text-sm">Simpan</button>
                </div>
              </form>
            </div>
          )}

          <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
            {users.map(u => (
              <div key={u.id} className="bg-white p-4 rounded-2xl border flex items-center space-x-4">
                <img src={u.photo} className="w-16 h-16 rounded-full object-cover" />
                <div>
                  <h3 className="font-black text-slate-800">{u.name}</h3>
                  <p className="text-xs font-bold text-slate-400">{u.nim}</p>
                  <p className="text-xs bg-indigo-50 text-indigo-700 px-2 py-1 rounded-lg inline-block mt-1 font-bold">{u.division}</p>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
